  #   staticPublishPath: ./dist
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
  #   envVars:
  #     - key: NODE_ENV
  #       value: production

  # Merchant App
  - type: web
    name: seller-griya
    env: static
    buildCommand: cd merchant-app && npm install && npm run build
    staticPublishPath: ./merchant-app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production

  # Delivery App
  - type: web
    name: delivery-griya
    env: static
    buildCommand: cd delivery-app && npm install && npm run build
    staticPublishPath: ./delivery-app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production